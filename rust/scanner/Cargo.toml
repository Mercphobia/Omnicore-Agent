[package]
name = "omnicore-scanner"
version = "0.1.0"
edition = "2024"
description = "High-speed network scanner — TCP/UDP port scan, banner grab, service detection"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OmniCore Configuration
# Copy to config.yaml and fill in your values.

# ── Provider ──
provider:
  # Primary: openrouter | openai | anthropic | gemini | deepseek | local
  default: openrouter
  
  openrouter:
    api_key: ""          # https://openrouter.ai/keys
    base_url: https://openrouter.ai/api/v1
    default_model: anthropic/claude-sonnet
  
  openai:
    api_key: ""
    base_url: https://api.openai.com/v1
    default_model: gpt-4o
  
  anthropic:
    api_key: ""
    default_model: claude-sonnet-4-20250514
  
  gemini:
    api_key: ""
    default_model: gemini-2.5-flash
  
  deepseek:
    api_key: ""
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-chat
  
  local:
    base_url: http://localhost:11434/v1
    default_model: llama3.2

# ── Router ──
router:
  smart_model: anthropic/claude-sonnet    # Complex tasks
  fast_model: google/gemini-2.5-flash     # Simple/triage
  cheap_model: deepseek/deepseek-chat     # Budget tasks
  auto_select: true                       # Auto-pick best model

# ── Agent ──
agent:
  name: OmniCore
  max_retries: 3
  max_thinking_depth: 5
  temperature: 0.7
  max_output_tokens: 4096
  
# ── Memory ──
memory:
  db_path: ~/.omnicore/memory.db
  vector_path: ~/.omnicore/vectors
  max_history: 100
  auto_summarize: true
  
# ── Tools ──
tools:
  terminal_enabled: true
  terminal_safe_mode: true    # Gated approval for destructive commands
  browser_enabled: false       # Requires playwright install
  git_enabled: true
  
# ── UI ──
ui:
  theme: dark
  streaming: true
  syntax_highlight: true
  max_history_display: 50

# ── Logging ──
logging:
  level: info
  format: json
  path: ~/.omnicore/logs